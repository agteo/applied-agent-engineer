name: Portfolio surface

on:
  push:
    branches: [main]
  pull_request:

jobs:
  portfolio-surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check portfolio artifacts
        run: python3 scripts/check_portfolio_surface.py
