name: Level 5 model improvement

on:
  push:
    branches: [main]
  pull_request:

jobs:
  level-5:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install pytest

      - name: Build Phase 3 prerequisites
        run: python3 -m evals.operations

      - name: Build Phase 4 prerequisites
        run: python3 -m datasets.strongbench

      - name: Run model-improvement tests
        run: python -m pytest evals/tests datasets/tests model_improvement/tests

      - name: Build StrongBench model-improvement bundle
        run: python3 -m model_improvement.strongbench

      - name: Validate optional LoRA dry-run config
        run: python3 -m model_improvement.strongbench.train_lora --dry-run
