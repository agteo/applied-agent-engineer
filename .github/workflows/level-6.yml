name: Level 6 environments

on:
  push:
    branches: [main]
  pull_request:

jobs:
  level-6:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install pytest

      - name: Run environment tests
        run: python -m pytest environments/tests

      - name: Build StrongBench finance environment bundle
        run: python3 -m environments.strongbench_finance

      - name: Fail if committed artifacts drifted from a fresh build
        run: git diff --exit-code -- environments
