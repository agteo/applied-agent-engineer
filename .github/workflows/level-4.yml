name: Level 4 data pipeline

on:
  push:
    branches: [main]
  pull_request:

jobs:
  level-4:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install pytest

      - name: Build Phase 3 prerequisites
        run: python3 -m evals.operations

      - name: Run dataset tests
        run: python -m pytest evals/tests datasets/tests

      - name: Build StrongBench dataset
        run: python3 -m datasets.strongbench
