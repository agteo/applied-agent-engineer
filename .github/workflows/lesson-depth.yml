name: Lesson depth

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lesson-depth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check lesson depth markers
        run: python3 scripts/check_lesson_depth.py
