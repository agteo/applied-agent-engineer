name: Level 7 RL reliability

on:
  push:
    branches: [main]
  pull_request:

jobs:
  level-7:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install pytest

      - name: Build Phase 6 prerequisites
        run: python3 -m environments.strongbench_finance

      - name: Run RL reliability tests
        run: python -m pytest environments/tests rl_reliability/tests

      - name: Build StrongBench RL reliability bundle
        run: python3 -m rl_reliability.strongbench

      - name: Smoke-check the Prime Intellect adapter
        run: python3 integrations/prime-intellect/environments/strongbench_finance_reliability/strongbench_finance_reliability.py

      - name: Fail if committed artifacts drifted from a fresh build
        run: git diff --exit-code -- environments rl_reliability integrations
