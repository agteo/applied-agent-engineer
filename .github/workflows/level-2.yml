name: Level 2 benchmark

on:
  push:
    branches: [main]
  pull_request:

jobs:
  level-2:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install pytest

      - name: Run Level 2 tests
        run: python -m pytest evals/tests

      - name: Run StrongBench benchmark release gate
        run: python3 -m evals.runner --model scripted --report evals/reports/sample-report.md
